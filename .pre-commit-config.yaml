repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-added-large-files
        name: check large pickle files in models/
        args: ['--maxkb=51200']  # 50MB limit
        files: '^models/.*\.pkl$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter. Used instead of black.
      - id: ruff-format
