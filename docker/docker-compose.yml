services:
  api:
    build:
      context: ..  # project root 
      dockerfile: docker/Dockerfile
      target: runtime
    image: duration-predictor-api:latest
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models  # Points up to the root models directory
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - ONNX_MODEL_PATH=/app/models/model.onnx
      - PICKLE_MODEL_PATH=/app/models/artifact.pkl
      - METADATA_PATH=/app/models/metadata.json
    restart: unless-stopped
